<style>
:root {
    --gold: #d4af37;
    --gold-light: #f5d97c;
    --black: #000000;
    --dark: #0d0d0d;
    --gray: #1a1a1a;
}

body {
    margin: 0;
    padding: 0;
    font-family: Poppins, sans-serif;
    background: var(--black);
    color: #ffffff;
}

html {
    scroll-behavior: smooth;
}

/* NAVBAR */
.navbar {
    background: var(--black) !important;
    box-shadow: 0 2px 12px rgba(255,255,255,0.1);
    padding: 10px 0;
}

.navbar-brand img {
    height: 55px;
}

.nav-link {
    color: var(--gold) !important;
    font-weight: 500;
    margin-left: 15px;
}

.nav-link:hover {
    color: var(--gold-light) !important;
}

/* HERO SECTION */
.hero-container {
    width: 100%;
    height: 85vh;
    max-height: 720px;
    position: relative;
    overflow: hidden;
    margin-top: 75px;
}

.hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    filter: brightness(65%);
}

.hero-img.active { opacity: 1; }

/* HERO TEXT */
.hero-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    text-align: center;
    text-shadow: 0 4px 14px rgba(0,0,0,0.9);
}

.hero-text h1 {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: 1px;
}

.hero-text a {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 28px;
    border-radius: 5px;
    background: var(--gold);
    color: black;
    text-decoration: none;
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(212,175,55,0.4);
}

.hero-text a:hover {
    background: var(--gold-light);
}

/* SECTION TITLE */
.section {
    padding: 80px 10%;
    text-align: center;
    background: var(--dark);
}

.section h2 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--gold);
    position: relative;
    display: inline-block;
}

.section h2::after {
    content: "";
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    position: absolute;
    left: 20%;
    bottom: -10px;
    border-radius: 10px;
}

/* WHY CHOOSE US */
#why {
    background: var(--black);
    border-top: 2px solid var(--gold);
    border-bottom: 2px solid var(--gold);
    padding: 70px 10%;
}

.why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 35px;
    margin-top: 40px;
}

.why-box {
    background: var(--gray);
    border-radius: 12px;
    padding: 30px 25px;
    border: 1px solid rgb(90, 90, 90);
    transition: 0.35s ease;
}

.why-box:hover {
    transform: translateY(-7px);
    border-color: var(--gold);
    box-shadow: 0 15px 30px rgba(212,175,55,0.28);
}

/* ICONS */
.why-box i {
    font-size: 48px;
    margin-bottom: 12px;
    background: linear-gradient(45deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: 0.3s ease;
}

.why-box:hover i {
    transform: scale(1.15);
    background: linear-gradient(45deg, var(--gold-light), white);
    -webkit-background-clip: text;
}

/* CONTACT SECTION */
#contact {
    background: var(--dark);
    padding: 75px 10%;
    border-top: 2px solid var(--gold);
}

.contact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 40px;
    margin-top: 40px;
}

.contact-box {
    background: var(--gray);
    padding: 28px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    transition: 0.3s ease;
}

.contact-box:hover {
    transform: translateY(-6px);
    border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(212,175,55,0.25);
}

.contact-btn {
    margin-top: 35px;
    background: var(--gold);
    color: black;
    padding: 12px 35px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
}

.contact-btn:hover {
    background: var(--gold-light);
}

/* FOOTER */
footer {
    background: var(--black);
    padding: 25px;
    text-align: center;
    border-top: 2px solid var(--gold);
    color: var(--gold);
    font-weight: 500;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .hero-container { height: 60vh; }
    .hero-text h1 { font-size: 2rem; }
}
</style>
</head>
